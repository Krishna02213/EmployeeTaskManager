{% extends 'base.html' %}
{% block title %}Change Password - Employee Task Manager{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="panel form-panel" style="max-width:480px;">
    <form method="POST" id="changePasswordForm" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="current_password">Current Password *</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password *</label>
            <input type="password" id="new_password" name="new_password" required minlength="6">
            <span class="hint-text">Minimum 6 characters.</span>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password *</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
            <span class="error-text" id="confirmError"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('changePasswordForm').addEventListener('submit', function (e) {
    const newPw = document.getElementById('new_password').value;
    const confirmPw = document.getElementById('confirm_password').value;
    const errorEl = document.getElementById('confirmError');
    errorEl.textContent = '';
    if (newPw !== confirmPw) {
        errorEl.textContent = 'Passwords do not match.';
        e.preventDefault();
    }
});
</script>
{% endblock %}
