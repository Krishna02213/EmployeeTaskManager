{% extends 'base.html' %}
{% block title %}My Profile - Employee Task Manager{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}
<div class="panel form-panel">
    <div class="profile-header">
        <img src="{{ url_for('uploaded_file', filename=user.profile_image or 'default.png') }}"
             class="avatar-lg" onerror="this.src='{{ url_for('static', filename='images/default.png') }}'">
        <div>
            <h2>{{ user.name }}</h2>
            <p class="text-muted">{{ user.designation or 'Employee' }} &middot; {{ user.department or 'N/A' }}</p>
        </div>
    </div>

    <form method="POST" action="{{ url_for('employee.edit_profile') }}" enctype="multipart/form-data" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-row">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required value="{{ user.name }}">
            </div>
            <div class="form-group">
                <label>Email (read-only)</label>
                <input type="email" value="{{ user.email }}" disabled>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ user.phone or '' }}">
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" value="{{ user.department or '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation" name="designation" value="{{ user.designation or '' }}">
            </div>
            <div class="form-group">
                <label for="profile_image">Update Profile Picture</label>
                <input type="file" id="profile_image" name="profile_image" accept="image/png,image/jpeg,image/gif">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
